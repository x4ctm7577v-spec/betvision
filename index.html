<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BetVision (100xBajo)</title>
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BetVision">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0E0A24">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#0E0A24;--glass:rgba(255,255,255,.065);--glass2:rgba(255,255,255,.11);--sunk:rgba(8,6,22,.45);
 --ink:#FFFFFF;--muted:#CBC5EC;--line:rgba(255,255,255,.13);
 --v:#7C5CFF;--p:#FF4D9A;--t:#2FE3C8;
 --grad:linear-gradient(120deg,#7C5CFF 0%,#C04DFF 50%,#FF4D9A 100%);--gradT:linear-gradient(120deg,#2FE3C8,#5AA8FF);
 --acc2:#B9A6FF;--ongrad:#FFFFFF;--away:rgba(255,255,255,.22);
 --pos:#3EF0A6;--neg:#FF7A9A;--warnbg:rgba(255,190,80,.12);--warnt:#FFD27A;--focus:#2FE3C8;
 --blob1:rgba(124,92,255,.55);--blob2:rgba(47,227,200,.28);--blob3:rgba(255,77,154,.30);
 --disp:"Unbounded","Arial Black",Arial,sans-serif;--text:"Manrope","Segoe UI",Roboto,Arial,sans-serif;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E0A24}}
:root[data-theme="dark"]{--bg:#0E0A24}
:root[data-theme="light"]{--bg:#F3F1FF;--glass:rgba(255,255,255,.72);--glass2:rgba(255,255,255,.9);--sunk:rgba(124,92,255,.07);--ink:#17123A;--muted:#4E4880;--line:rgba(60,40,160,.14);--acc2:#5B3BE6;--away:rgba(23,18,58,.15);--pos:#0E9F6E;--neg:#D6336C;--warnbg:#FFF3D6;--warnt:#8A5A00;--focus:#5B3BE6;--blob1:rgba(124,92,255,.28);--blob2:rgba(47,227,200,.22);--blob3:rgba(255,77,154,.18)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--text);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(55% 40% at 8% 2%,var(--blob1),transparent 70%),
 radial-gradient(45% 35% at 100% 28%,var(--blob2),transparent 70%),
 radial-gradient(60% 45% at 40% 105%,var(--blob3),transparent 70%)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.g,.panel,.hero,.tile,.info,details.cal,.reco,nav{background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.wrap{max-width:560px;margin:0 auto;padding:0 18px 128px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px 0 18px}
.who{display:flex;align-items:center;gap:12px;min-width:0}
.av{width:48px;height:48px;border-radius:16px;background:var(--grad);display:grid;place-items:center;font-family:var(--disp);font-weight:700;font-size:16px;color:#fff;flex:none;box-shadow:0 8px 24px rgba(124,92,255,.45)}
.brand{font-family:var(--disp);font-weight:700;font-size:22px;letter-spacing:-.01em;line-height:1.1;white-space:nowrap}
.brand span{font-family:var(--text);font-weight:600;font-size:14px;color:var(--muted)}
.stamp{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:3px}
.stamp svg{width:15px;height:15px;stroke:var(--t);fill:none;stroke-width:2;flex:none}
.round{width:46px;height:46px;border-radius:16px;border:1px solid var(--line);background:var(--glass2);display:grid;place-items:center;cursor:pointer;flex:none}
.round svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round}
.info{border-radius:20px;padding:12px 16px;font-size:14px;color:var(--muted);margin:0 0 18px}
.info b{color:var(--ink)}
/* Parlay recomendado */
.reco{position:relative;overflow:hidden;border-radius:28px;padding:20px 18px 18px;margin:0 0 16px;border-color:rgba(255,255,255,.2)}
.reco::before{content:"";position:absolute;inset:0;background:var(--grad);opacity:.22;z-index:-1}
.reco h2{font-family:var(--disp);font-weight:700;font-size:21px;letter-spacing:-.01em;margin:0 0 4px}
.reco h2 span{display:inline-block;margin-top:6px;font-family:var(--text);font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--gradT);color:#0E0A24;vertical-align:middle}
.rb{padding:14px 0 4px;border-top:1px solid var(--line);margin-top:10px}
.rd{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:4px;text-transform:none}
.rl{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;font-weight:700}
.rl b{font-family:var(--disp);font-weight:600;font-size:20px}
.rs{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin:10px 0 4px;background:var(--sunk);border-radius:18px;padding:12px 14px}
.rs .big{font-size:40px}
.rf{font-family:var(--disp);font-weight:600;font-size:24px}
.reco .add{width:100%;margin-top:10px;padding:13px}
/* Medidor */
.hero{display:block;width:100%;text-align:center;border-radius:28px;padding:18px 18px 16px;cursor:pointer;margin-bottom:12px}
.hl{font-size:14px;color:var(--muted);font-weight:600}
.scale{display:flex;justify-content:space-between;align-items:flex-end;margin:8px 4px 10px}
.sn{font-weight:700;font-size:13px;color:var(--muted);width:36px}
.big{font-family:var(--disp);font-weight:700;font-size:46px;line-height:1;letter-spacing:-.02em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.ruler{position:relative;height:28px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 4px}
.ruler span{width:3px;border-radius:3px;background:var(--away)}
.ruler span:nth-child(5n+1){background:var(--t)}
.ruler i{position:absolute;bottom:-12px;width:14px;height:14px;border-radius:50%;background:var(--grad);box-shadow:0 0 0 4px rgba(124,92,255,.35);transform:translateX(-50%);margin-left:4px}
.hint{font-size:14px;color:var(--muted);margin-top:16px}
/* Deportes */
.tiles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:22px 0 16px}
@media(max-width:420px){.tiles{grid-template-columns:1fr 1fr}}
.tile{position:relative;border-radius:22px;padding:16px 10px 14px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;transition:transform .15s,border-color .2s}
.tile:not(:disabled):hover{transform:translateY(-2px)}
.tile svg{width:36px;height:36px;stroke:var(--ink);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tile .tx{display:flex;flex-direction:column;align-items:center;gap:2px}
.tile b{font-family:var(--disp);font-weight:600;font-size:15px}
.tile small{color:var(--muted);font-size:13px;text-align:center;font-weight:600}
.tile[aria-pressed="true"]{background:var(--glass2);border-color:rgba(255,255,255,.35);box-shadow:0 0 0 2px var(--v)}
.tile:disabled{cursor:default}
.tile.soon svg{opacity:.55}
.cd{font-size:12px;font-weight:800;color:var(--t)}
.tile.live{grid-column:1/-1;flex-direction:row;justify-content:flex-start;gap:14px;padding:16px 18px;text-align:left}
.tile.live svg{width:46px;height:46px;stroke:var(--t)}
.tile.live .tx{align-items:flex-start}.tile.live small{text-align:left}
.tile.live b{font-size:22px}
.lb{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:#0E0A24;background:var(--gradT);border-radius:999px;padding:3px 10px}
.lb i{width:7px;height:7px;border-radius:50%;background:#0E0A24}
details.cal{border-radius:22px;padding:2px 18px;margin:0 0 18px}
details.cal summary{cursor:pointer;font-weight:800;padding:15px 0;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.cal summary::-webkit-details-marker{display:none}
details.cal summary::after{content:"+";display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--glass2);font-size:18px}
details.cal[open] summary::after{content:"−"}
.cal h3{font-family:var(--disp);font-size:14px;font-weight:600;margin:14px 0 4px;color:var(--acc2)}
.ev2{display:grid;grid-template-columns:1fr auto;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.ev2 span:last-child{color:var(--muted);text-align:right}
.ev2.now span:first-child{font-weight:800}.ev2.now span:last-child{color:var(--t);font-weight:800}
/* Controles */
.row{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 14px;font-size:14px;color:var(--muted);font-weight:600}
.row label{display:flex;flex-direction:column;gap:5px;flex:1;min-width:140px}
select,input[type=text],input[type=number],input[type=email],input[type=password]{color:var(--ink);-webkit-text-fill-color:var(--ink);background:var(--glass2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-weight:600}
select:focus,input:focus{outline:none;border-color:var(--t);box-shadow:0 0 0 3px rgba(47,227,200,.25)}
select option{color:#17123A}
h2.day{font-family:var(--disp);font-weight:600;font-size:17px;margin:28px 0 12px;display:flex;align-items:center;gap:10px}
h2.day::after{content:"";flex:1;height:1px;background:var(--line)}
/* Partidos */
.g{border-radius:24px;padding:16px 16px 14px;margin:0 0 12px}
.gh{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px}
.gh .live{color:var(--p);font-weight:800}
.side{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 10px;align-items:center;padding:6px 0}
.side .nm{font-weight:700}
.side .nm i{font-style:normal;font-weight:600;color:var(--muted);font-size:13px}
.side .pc{font-family:var(--disp);font-weight:600;font-size:24px;line-height:1}
.side:first-of-type .pc{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.ab{display:inline-grid;place-items:center;min-width:44px;height:26px;margin-right:8px;padding:0 8px;border-radius:9px;font-size:13px;font-weight:800;letter-spacing:.02em;color:#fff;background:var(--grad);vertical-align:1px}
.side:not(:first-of-type) .ab,.rl .ab{background:var(--glass2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.rl .ab{background:var(--gradT);color:#0E0A24;box-shadow:none}
.bar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--sunk);gap:3px}
.bh{background:var(--grad);border-radius:99px}.ba{background:var(--away);border-radius:99px}
.ctl{grid-column:1/-1;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted);font-weight:600}
.ctl label{display:flex;align-items:center;gap:6px}
.ctl input{width:86px}
.ev{font-weight:800}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.chk{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--glass2);display:grid;place-items:center;cursor:pointer;margin-left:auto;transition:transform .12s}
.chk:active{transform:scale(.94)}
.chk svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.chk::before{content:"+";font-size:22px;font-weight:600;color:var(--muted);position:absolute}
.chk{position:relative}
.chk[aria-pressed="true"]{background:var(--grad);border-color:transparent;box-shadow:0 6px 18px rgba(192,77,255,.45)}
.chk[aria-pressed="true"]::before{content:""}
.chk[aria-pressed="true"] svg{opacity:1}
.recent{font-size:13px;font-weight:600;color:var(--muted);margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
.none{color:var(--muted);font-size:14px}
.panel{border-radius:24px;padding:18px;margin:14px 0}
.panel h2{font-family:var(--disp);font-weight:700;font-size:19px;margin:0 0 6px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.kpi{background:var(--sunk);border-radius:18px;padding:12px}
.kpi .l{font-size:13px;font-weight:600;color:var(--muted)}
.kpi .big{font-size:28px}
.leg{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);align-items:center}
.leg:last-child{border-bottom:0}
.leg button[data-rm]{background:var(--glass2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;color:var(--neg);cursor:pointer;font-size:13px;font-weight:700}
.add{border:0;background:var(--grad);color:#fff;border-radius:999px;padding:9px 20px;cursor:pointer;font-weight:800;margin-top:4px;box-shadow:0 8px 24px rgba(192,77,255,.4);transition:transform .12s,box-shadow .2s}
.add:hover{box-shadow:0 10px 30px rgba(192,77,255,.55)}
.add:active{transform:scale(.97)}
.warn{background:var(--warnbg);border:1px solid var(--line);border-radius:18px;padding:10px 12px;font-size:15px;margin:10px 0}
.warn b{color:var(--warnt)}
.note{font-size:14px;color:var(--muted)}
ul{padding-left:18px;margin:6px 0}li{margin:6px 0}li::marker{color:var(--t)}
nav{position:fixed;left:14px;right:14px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:420px;margin:0 auto;border-radius:999px;display:flex;justify-content:space-around;padding:6px;z-index:5;background:rgba(20,15,50,.72);box-shadow:0 12px 36px rgba(0,0,0,.45)}
:root[data-theme="light"] nav{background:rgba(255,255,255,.85)}
nav button{flex:1;background:none;border:0;border-radius:999px;padding:9px 4px;font-size:12px;font-weight:800;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-selected="true"]{color:#fff;background:var(--grad)}
nav .n{position:absolute;top:2px;left:calc(50% + 8px);min-width:18px;border-radius:9px;background:var(--t);color:#0E0A24;font-size:11px;padding:0 5px;font-weight:800}
@media (prefers-reduced-motion:no-preference){.lb i{animation:pulse 1.4s ease-in-out infinite}@keyframes pulse{50%{opacity:.25}}.chk svg{transition:opacity .15s}}

.form{display:flex;flex-direction:column;gap:10px}
.form input[type=email],.form input[type=password],.form input[type=number],.form input[type=text]{width:100%}
.form label.ck{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--muted)}
.form label.ck input{width:20px;height:20px;accent-color:#7C5CFF;flex:none;margin-top:2px}
.btn2{border:1px solid var(--line);background:var(--glass2);border-radius:999px;padding:9px 18px;cursor:pointer;font-weight:800}
.link{background:none;border:0;color:var(--acc2);cursor:pointer;font-weight:700;padding:0;text-decoration:underline}
.lock{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--acc2)}
.reg{border:1px solid var(--line);background:var(--glass2);border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:800;font-size:13px}
.sug{color:var(--t);font-weight:800}
.status{font-weight:800}.status.won{color:var(--pos)}.status.lost{color:var(--neg)}.status.open,.status.push{color:var(--muted)}
dialog{border:1px solid var(--line);border-radius:24px;background:#1A1440;color:var(--ink);padding:20px;width:min(92vw,420px)}
:root[data-theme="light"] dialog{background:#fff}
dialog::backdrop{background:rgba(5,3,20,.6);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
dialog h2{font-family:var(--disp);font-size:18px;margin:0 0 4px}
.drow{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--gradT);color:#0E0A24;font-weight:800;padding:10px 18px;border-radius:999px;z-index:20;display:none;max-width:90vw;text-align:center}
.cta{border-radius:28px;padding:20px 18px;margin:0 0 16px;position:relative;overflow:hidden;background:var(--glass);border:1px solid rgba(255,255,255,.2);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.cta::before{content:"";position:absolute;inset:0;background:var(--grad);opacity:.25;z-index:-1}
.cta h2{font-family:var(--disp);font-size:20px;margin:0 0 6px}
.cta ul{margin:8px 0 12px}
.cta .add{width:100%;padding:13px}
nav{max-width:480px}
.bet{display:inline-flex;align-items:center;border-radius:999px;padding:6px 12px;font-weight:800;font-size:13px;text-decoration:none;background:var(--gradT);color:#0E0A24}
.why{border-top:1px solid var(--line);padding:12px 0}
.wt{font-family:var(--disp);font-weight:600;font-size:15px;margin-bottom:8px}
.wc{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:14px}
.wc>div{background:var(--sunk);border-radius:14px;padding:10px}
.wl{display:block;font-size:12px;font-weight:800;color:var(--muted);margin-bottom:4px}
.wl.bv{color:var(--t)}
input::placeholder{color:var(--muted);-webkit-text-fill-color:var(--muted);opacity:1}
input:-webkit-autofill,input:-webkit-autofill:focus{-webkit-text-fill-color:var(--ink);-webkit-box-shadow:0 0 0 1000px #2A2350 inset;caret-color:var(--ink)}
:root[data-theme="light"] input:-webkit-autofill{-webkit-box-shadow:0 0 0 1000px #fff inset}
.pw{position:relative}.pw input{padding-right:48px}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;font-size:20px;cursor:pointer;padding:6px}
.ck span{display:block}
</style>
</head>
<body>
<div class="wrap">
 <header class="top"><div class="who"><span class="av" aria-hidden="true">BV</span><div><div class="brand">BetVision <span>(100xBajo)</span></div>
 <div class="stamp" id="stamp">Cargando datos…</div></div></div>
 <button class="round" data-tab="guide" aria-label="Guía, términos y ajustes"><svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h14"/></svg></button></header>
 <main id="view"><div class="panel"><p>Cargando…</p></div></main>
</div>
<nav role="tablist">
 <button role="tab" data-tab="games" aria-selected="true"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Partidos</button>
 <button role="tab" data-tab="parlay" aria-selected="false"><svg viewBox="0 0 24 24"><rect x="2" y="9" width="3" height="6" rx="1"/><rect x="5.5" y="6.5" width="3.5" height="11" rx="1"/><rect x="15" y="6.5" width="3.5" height="11" rx="1"/><rect x="19" y="9" width="3" height="6" rx="1"/><path d="M9 12h6"/></svg>Parlay<span class="n" id="legN">0</span></button>
 <button role="tab" data-tab="record" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4zM17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>Récord</button>
 <button role="tab" data-tab="bets" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M8 15l4-4 3 3 5-6"/></svg>Apuestas</button>
 <button role="tab" data-tab="account" aria-selected="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Cuenta</button>
 
</nav>
<dialog id="dlg"></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<script>
const $=s=>document.querySelector(s);
const ls={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct=p=>(p*100).toFixed(1).replace('.0','')+'%';
const sg=x=>(x>=0?'+':'')+(x*100).toFixed(1)+'%';
const us=d=>d>=2?'+'+Math.round((d-1)*100):'-'+Math.round(100/(d-1));
const money=x=>(x<0?'-$':'$')+Math.abs(x).toFixed(2);
const dec=t=>{const x=parseFloat(String(t).replace(',','.'));if(isNaN(x))return null;if(x>=100)return 1+x/100;if(x<=-100)return 1+100/Math.abs(x);return x>1?x:null};

 <div class="kpi"><div class="l">CLV promedio</div><div class="big">${clv==null?'—':sg(clv)}</div><div class="l">contra la cuota de cierre</div></div>
 <div class="kpi"><div class="l">Parlays del día</div><div class="big">${pw}–${pl}</div><div class="l">${ps.length?un(pun):'sin calificar aún'}</div></div></div>
 <p class="note"><b>1 unidad (u)</b> es el monto fijo que apostarías cada vez, por ejemplo $10. Si el modelo está bien calibrado, el acierto real debería parecerse a la probabilidad media. Con pocas selecciones, los números cambian mucho; el récord se vuelve confiable con cientos de resultados.</p>`;
 if(!REC.premium&&REC.pending)h+=`<div class="cta"><h2>${REC.pending} recomendaciones en juego</h2><p class="note">Con Premium las ves antes de que empiece el partido, no solo el resultado.</p><button class="add" data-act="subscribe">Probar ${CFG.trialDays||7} días gratis</button></div>`;
 h+=`<div class="chips" style="display:flex;gap:8px;margin:14px 0 4px">${[['all','Todas'],['won','Ganadas'],['lost','Perdidas']].concat(REC.premium?[['open','En juego']]:[]).map(([k,t])=>`<button class="btn2" data-recf="${k}" style="${f===k?'background:var(--grad);color:#fff;border-color:transparent':''}">${t}</button>`).join('')}</div>`;
 const pk=P.filter(keep),pp=PL.filter(keep);
 h+=`<div class="panel"><h2>Selecciones con valor</h2>${pk.length?pk.slice(0,150).map(x=>recRow(`${esc(x.team)} <span class="note">vs ${esc(x.opponent)}</span>`,`${esc(x.league)}, ${when(x.start_time)}. ${us(+x.odds)} en ${esc(x.book||'la mejor casa')}, probabilidad ${pct(+x.prob)}, valor ${sg(+x.ev)}`,x.status,x.profit)).join(''):'<p class="note">Nada en este filtro todavía.</p>'}</div>`;
 h+=`<div class="panel"><h2>Parlays recomendados</h2>${pp.length?pp.slice(0,60).map(x=>recRow(`${x.kind==='valor'?'Más valor':'Más probable'}, ${new Date(x.day+'T12:00:00').toLocaleDateString('es',{day:'numeric',month:'short'})}`,`${(x.legs||[]).map(l=>esc(l.team)).join(' + ')}. Cuota ${us(+x.odds)}, probabilidad ${pct(+x.prob)}`,x.status,x.profit)).join(''):'<p class="note">Nada en este filtro todavía.</p>'}</div>`;
 return h}

function renderAccount(){
 if(!SB)return '<div class="panel"><h2>Cuenta</h2><p>Las cuentas aún no están configuradas en el servidor (faltan las variables de Supabase).</p></div>';
 if(!SESSION){const up=S.auth==='signup';return `<div class="panel"><h2>${up?'Crea tu cuenta':'Entra a tu cuenta'}</h2><form class="form" id="authForm">
  <input type="email" name="email" placeholder="Correo electrónico" required autocomplete="email" autocapitalize="none"><div class="pw"><input type="password" id="pwd" name="password" placeholder="Contraseña (mínimo 6)" minlength="6" required autocomplete="${up?'new-password':'current-password'}"><button type="button" class="eye" data-act="eye" aria-label="Mostrar contraseña">👁</button></div>
  ${up?`<label class="ck"><input type="checkbox" name="age" required>Confirmo que tengo 21 años o más.</label><label class="ck"><input type="checkbox" name="terms" required><span>Entiendo que BetVision ofrece análisis informativos, no garantiza ganancias y no es una casa de apuestas, y acepto los <a href="/terminos" target="_blank" class="link">Términos y la Política de privacidad</a>.</span></label>`:''}
  <button class="add" type="submit">${up?'Crear cuenta':'Entrar'}</button></form>
  <p class="note">${up?'¿Ya tienes cuenta? <button class="link" data-auth="login">Entra aquí</button>':'¿No tienes cuenta? <button class="link" data-auth="signup">Créala aquí</button>. <button class="link" data-act="reset">Olvidé mi contraseña</button>'}</p></div>`}
 const st={active:'Premium activo',trialing:'Suscrito: tu primer cobro llega al terminar la prueba',past_due:'Pago pendiente: actualiza tu tarjeta',canceled:'Suscripción cancelada',none:'Plan gratis'};
 const dl=ME&&ME.trial_ends?Math.max(0,Math.ceil((new Date(ME.trial_ends)-Date.now())/864e5)):0;
 return `<div class="panel"><h2>Tu cuenta</h2><p>${esc(ME?ME.email:'')}</p><p><b>${ME&&ME.on_trial?`Prueba gratis: te ${dl===1?'queda 1 día':'quedan '+dl+' días'}`:ME&&ME.paying?(st[ME.sub_status]||'Premium activo'):ME&&ME.sub_status&&ME.sub_status!=='none'?st[ME.sub_status]||'Plan gratis':(ME&&ME.trial_ends?'Tu prueba gratis terminó':'Plan gratis')}</b>${ME&&ME.on_trial?`<br><span class="note">Tienes Premium completo hasta el ${new Date(ME.trial_ends).toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'})}.</span>`:ME&&ME.paying&&ME.period_end?`<br><span class="note">${ME.sub_status==='trialing'?'Primer cobro':'Se renueva'} el ${new Date(ME.period_end).toLocaleDateString('es',{day:'numeric',month:'long'})}</span>`:''}</p>
 ${ME&&ME.paying?'<button class="btn2" data-act="portal">Administrar o cancelar suscripción</button>':ME&&ME.on_trial?`<button class="add" data-act="subscribe">Suscribirme ahora</button><p class="note">No se cobra nada hasta que terminen tus días de prueba.</p>`:`<button class="add" data-act="subscribe">Suscribirme por ${esc(CFG.price||'$99 al mes')}</button>`}</div>
 ${premium()?`<div class="panel"><h2>Tu presupuesto</h2><p class="note">El dinero que apartas solo para apostar. BetVision sugiere apostar una fracción pequeña cuando hay valor (máximo 2 % por apuesta).</p><div class="row"><label>Presupuesto ($)<input type="number" id="bankroll" min="0" value="${ME?ME.bankroll:0}"></label></div><button class="btn2" data-act="bankroll">Guardar</button></div>`:''}
 ${booksPanel()}
 <div class="panel"><button class="btn2" data-act="logout">Cerrar sesión</button></div>`}

function whyPanel(){const r=(t,a,b)=>`<div class="why"><div class="wt">${t}</div><div class="wc"><div><span class="wl">Influencer</span>${a}</div><div><span class="wl bv">BetVision</span>${b}</div></div></div>`;
 return `<div class="panel" id="por-que"><h2>¿Por qué BetVision y no un influencer?</h2><p>Un influencer te da su opinión. BetVision te da los números para que decidas tú.</p>
 ${r('Su récord','Muchos solo publican sus aciertos. Sus pérdidas son difíciles de comprobar.','Cada recomendación queda guardada sola con su cuota y su resultado, ganada o perdida. El récord completo es público.')}
 ${r('El método','Opinión, intuición o el análisis de una sola persona.','Compara las cuotas de todas las casas, les quita su margen y calcula la probabilidad de consenso de todo el mercado.')}
 ${r('La cuota','Cuando ves su pick, miles ya lo siguieron y la cuota empeoró.','Te muestra en ese momento la mejor cuota disponible y si todavía tiene valor.')}
 ${r('Cómo gana dinero','Muchos cobran comisión de las casas por cada seguidor que se registra, y rara vez lo dicen.',(CFG.affiliates||[]).length?'Cobra una suscripción y puede recibir comisión si abres cuenta desde sus enlaces. Te lo dice claramente, y eso nunca cambia las probabilidades ni el valor que te muestra.':'Cobra una suscripción fija. No gana nada cuando tú pierdes.')}
 ${r('Cuánto apostar','Te dice qué jugar, pero rara vez cuánto según tu presupuesto.','Te sugiere un monto pequeño según tu presupuesto, nunca más del 2 % por apuesta.')}
 ${r('Cómo sabes si funciona','Esperas a ver si gana o pierde.','El CLV te dice si estás apostando mejor que el mercado, incluso antes de ver resultados.')}
 <p class="note">Ninguna persona ni herramienta garantiza ganancias. La diferencia es que con BetVision puedes comprobarlo todo, empezando por el <button class="link" data-tab="record">récord completo</button>.</p></div>`}

function renderGuide(){return `<div class="panel"><h2>Ajustes</h2><button class="btn2" data-act="theme">Cambiar tema claro u oscuro</button></div>`+whyPanel()+(SESSION?'':booksPanel())+`<div class="panel"><h2>Cómo leer BetVision</h2><ul><li><b>Probabilidad:</b> consenso de todas las casas sin su margen.</li><li><b>Valor:</b> probabilidad por cuota menos 1. Verde significa que la cuota paga más de lo justo.</li><li><b>CLV:</b> si tu cuota es mejor que la de cierre de forma constante, vas por buen camino.</li><li>Pocas selecciones con valor rinden más que muchos favoritos juntos.</li></ul></div>
 <div class="panel"><p class="note">BetVision ofrece análisis informativos. No es una casa de apuestas, no acepta apuestas y no garantiza ganancias. Solo para mayores de 21 años y donde las apuestas deportivas sean legales.</p><p class="note">Juego responsable: si apostar deja de ser entretenimiento, busca ayuda. En EE. UU.: 1-800-GAMBLER. (esto es 100 pa bajo)</p><p class="note"><a class="link" href="/terminos">Términos y Política de privacidad</a></p></div>`}
function render(){if(!DATA)return;$('#stamp').textContent=DATA.updated?'Actualizado '+ago(DATA.updated):'Cargando datos…';
 const err=(DATA.errors||[]).length?`<div class="warn"><b>Aviso:</b> ${DATA.errors.map(esc).join('<br>')}</div>`:'';
 const V={games:renderGames,parlay:renderParlay,record:renderRecord,bets:renderBets,account:renderAccount,guide:renderGuide};
 $('#view').innerHTML=(S.tab==='games'?err:'')+V[S.tab]();
 document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===S.tab));$('#legN').textContent=legs().length}

/* ----- acciones ----- */
async function act(a){if(a==='theme'){const c=document.documentElement.dataset.theme==='light'?'dark':'light';document.documentElement.dataset.theme=c;ls.set('bv-theme',c);return}if(a==='eye'){const i=$('#pwd');if(i){i.type=i.type==='password'?'text':'password';const b=document.querySelector('.eye');if(b)b.setAttribute('aria-label',i.type==='password'?'Mostrar contraseña':'Ocultar contraseña')}return}try{
 if(a==='subscribe'){if(!SESSION){S.tab='account';S.auth='signup';render();toast('Crea tu cuenta y empiezan tus 7 días gratis.');return}const r=await api('/api/checkout',{method:'POST'});location.href=r.url}
 else if(a==='portal'){const r=await api('/api/portal',{method:'POST'});location.href=r.url}
 else if(a==='bankroll'){const v=+$('#bankroll').value||0;ME=await api('/api/me',{method:'PUT',body:JSON.stringify({bankroll:v})}).then(r=>({...ME,...r}));toast('Presupuesto guardado.');render()}
 else if(a==='logout'){await SB.auth.signOut();SESSION=null;await refreshAll()}
 else if(a==='reset'){const em=prompt('Escribe tu correo');if(em){await SB.auth.resetPasswordForEmail(em,{redirectTo:location.origin});toast('Te enviamos un correo para cambiar la contraseña.')}}
 }catch(e){toast(e.message||'Algo salió mal')}}
function openReg(k){const [gid,i]=k.split('|');const g=DATA.games.find(x=>x.id===gid),o=g.outcomes[+i];const price=quote(o).price;const s=sugStake(o);
 const d=$('#dlg');d.innerHTML=`<form method="dialog" class="form" id="regForm"><h2>Registrar apuesta</h2><p class="note" style="margin:0">${esc(o.name)} vs ${esc(o.name===g.home?g.away:g.home)}, ${when(g.start)}</p>
 <label class="note">Cuota que tomaste (americana)<input type="text" name="odds" inputmode="numeric" value="${us(price)}" required></label>
 <label class="note">Cuánto apostaste ($)<input type="number" name="stake" min="1" step="0.01" value="${s?s.toFixed(2):10}" required></label>
 <div class="drow"><button class="btn2" value="cancel" formnovalidate>Cancelar</button><button class="add" value="ok">Guardar</button></div></form>`;
 d.dataset.k=k;d.showModal()}
document.addEventListener('submit',async e=>{
 if(e.target.id==='authForm'){e.preventDefault();const f=new FormData(e.target),email=f.get('email'),password=f.get('password');
  try{if(S.auth==='signup'){const {error}=await SB.auth.signUp({email,password,options:{data:{age_21_confirmed:true,terms_accepted_at:new Date().toISOString()},emailRedirectTo:location.origin}});if(error)throw error;toast('¡Listo! Confirma tu correo y empiezan tus 7 días de Premium gratis.');S.auth='login';render()}
   else{const {error}=await SB.auth.signInWithPassword({email,password});if(error)throw error;toast('¡Bienvenido!')}}catch(err){toast(err.message)}}
 if(e.target.id==='regForm'&&e.submitter&&e.submitter.value==='ok'){e.preventDefault();const f=new FormData(e.target),odds=dec(f.get('odds')),stake=+f.get('stake');const [gid,i]=$('#dlg').dataset.k.split('|');
  if(!odds){toast('Escribe la cuota como -150 o +130.');return}
  try{await api('/api/bets',{method:'POST',body:JSON.stringify({gid,idx:+i,odds,stake})});$('#dlg').close();BETS=null;toast('Apuesta registrada.')}catch(err){toast(err.message)}}});
document.addEventListener('click',e=>{const t=e.target.closest('[data-tab],[data-lg],[data-leg],[data-rm],[data-set],[data-act],[data-auth],[data-reg],[data-del],[data-recf]');if(!t)return;
 if(t.dataset.recf){S.recF=t.dataset.recf;render();return}
 if(t.dataset.act)return act(t.dataset.act);
 if(t.dataset.reg)return openReg(t.dataset.reg);
 if(t.dataset.del){if(confirm('¿Borrar esta apuesta?'))api('/api/bets?id='+t.dataset.del,{method:'DELETE'}).then(()=>{BETS=null;render()});return}
 if(t.dataset.auth){S.auth=t.dataset.auth}
 else if(t.dataset.tab){S.tab=t.dataset.tab;window.scrollTo(0,0)}else if(t.dataset.lg)S.lg=t.dataset.lg;
 else if(t.dataset.leg){const k=t.dataset.leg,gid=k.split('|')[0];LEGS=LEGS.includes(k)?LEGS.filter(x=>x!==k):[...LEGS.filter(x=>x.split('|')[0]!==gid),k]}
 else if(t.dataset.rm)LEGS=LEGS.filter(x=>x!==t.dataset.rm);else if(t.dataset.set)LEGS=t.dataset.set.split(',');
 ls.set('bv-legs',LEGS);const y=window.scrollY;render();if(!t.dataset.tab)window.scrollTo(0,y)});
document.addEventListener('change',e=>{if(e.target.id==='stateSel')return savePref('state',e.target.value);if(e.target.id==='bookSel')return savePref('book',e.target.value);if(e.target.id==='sort'){S.sort=e.target.value;render()}if(e.target.id==='stake'){S.stake=Math.max(1,+e.target.value||1);render()}});
const TH=ls.get('bv-theme',null);if(TH)document.documentElement.dataset.theme=TH;

init();

</script>

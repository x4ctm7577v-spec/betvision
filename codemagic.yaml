# Codemagic: compila BetVision para iPhone en una Mac en la nube y la sube a TestFlight / App Store.
workflows:
  ios-app-store:
    name: BetVision iOS → App Store
    max_build_duration: 60
    working_directory: ios-app
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: BetVision ASC   # el nombre que le pongas a tu clave de App Store Connect en Codemagic
    environment:
      xcode: latest
      node: 22
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.betvision.cienxbajo
      vars:
        BUNDLE_ID: com.betvision.cienxbajo
        APP_VERSION: 1.0.0
        APP_STORE_APPLE_ID: "0000000000"   # el Apple ID numérico de la app (App Store Connect → Información de la app)
    triggering:
      events: []   # se compila solo cuando tocas "Start new build"
    scripts:
      - name: Instalar dependencias
        script: npm install --no-audit --no-fund || npm install --legacy-peer-deps --no-audit --no-fund
      - name: Número de versión
        script: |
          LAST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          echo "BUILD_NUMBER=$((LAST + 1))" >> $CM_ENV
      - name: Preparar proyecto iOS
        script: bash scripts/ios-setup.sh
      - name: Firma
        script: xcode-project use-profiles
      - name: Pods
        script: cd ios/App && pod install
      - name: Compilar .ipa
        script: |
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - ios-app/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
